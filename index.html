<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tuition Fee</title>
<!-- Firebase Google Auth + Firestore cloud sync enabled -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4EFE2;
    --paper-raised:#FBF8F0;
    --ink:#26241C;
    --ink-soft:#5B5546;
    --line:#DCD3BC;
    --line-soft:#E9E2CE;
    --green:#3F6C51;
    --green-bg:#E4ECE3;
    --rust:#A6402C;
    --rust-bg:#F4E2DC;
    --gold:#B98A2E;
    --gold-bg:#F1E4C4;
    --navy:#233A36;
    --radius:3px;
    --shadow:0 1px 0 rgba(38,36,28,0.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--line-soft);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.4;
    min-height:100vh;
  }
  /* The shell caps the app at a phone-like width and re-centers it no matter
     how wide the actual viewport reports itself as (e.g. a browser's
     "Desktop site" mode, which ignores the mobile viewport meta tag and
     fakes a ~980px-wide screen). The transform below also gives this shell
     its own containing block, so every position:fixed element inside it
     (FAB, menus, modals, toast, the lock screen) stays confined to the
     app's width instead of spreading across the full fake-desktop width. */
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  @media (min-width:560px){
    #shell{ box-shadow:0 0 0 1px var(--line), 0 12px 50px rgba(38,36,28,0.18); }
  }
  ::selection{background:var(--gold-bg);}

  /* Account screen — same Tuition Fee palette, Samsung A56 friendly */
  #authScreen{position:fixed;inset:0;background:var(--navy);color:#EFE9D8;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;}
  #authScreen.hidden{display:none;}
  .auth-card{width:100%;max-width:380px;margin:auto;}
  .auth-mark{font-family:'Fraunces',serif;font-weight:600;font-size:26px;text-align:center;margin-bottom:5px;}
  .auth-welcome{font-family:'Fraunces',serif;font-size:19px;text-align:center;margin-bottom:4px;}
  .auth-sub{font-size:12.5px;color:rgba(239,233,216,.68);text-align:center;margin-bottom:16px;line-height:1.45;}
  .auth-section{border:1px solid rgba(239,233,216,.18);border-radius:var(--radius);padding:12px;margin-top:10px;}
  .auth-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px;color:#EFE9D8;}
  .auth-card label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(239,233,216,.62);margin:9px 0 4px;}
  .auth-card input{width:100%;min-height:44px;padding:10px 11px;border-radius:var(--radius);border:1px solid rgba(239,233,216,.30);background:rgba(239,233,216,.08);color:#EFE9D8;font-family:'Inter',sans-serif;font-size:16px;outline:none;}
  .auth-card input::placeholder{color:rgba(239,233,216,.42);}
  .auth-card input:focus{border-color:var(--gold);background:rgba(239,233,216,.11);}
  .auth-btn,.auth-secondary,.social-btn{width:100%;min-height:44px;margin-top:9px;padding:10px 12px;border-radius:var(--radius);font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .auth-btn{border:none;background:var(--gold);color:#26241C;}
  .auth-secondary{border:1px solid rgba(239,233,216,.28);background:rgba(239,233,216,.08);color:#EFE9D8;}
  .social-btn{border:1px solid rgba(239,233,216,.28);background:transparent;color:#EFE9D8;}
  .auth-error{color:#E7A897;font-size:12px;margin-top:7px;min-height:15px;text-align:center;}
  .auth-forgot{text-align:center;margin-top:12px;font-size:12px;color:rgba(239,233,216,.7);text-decoration:underline;cursor:pointer;touch-action:manipulation;}
  .account-note{font-size:10.5px;line-height:1.45;color:rgba(239,233,216,.48);margin-top:9px;}
  .account-details{
    margin:18px 0 4px;border:1px solid rgba(239,233,216,.22);
    border-radius:var(--radius);overflow:hidden;text-align:left;
  }
  .account-details div{padding:10px 12px;border-bottom:1px solid rgba(239,233,216,.12);font-size:13px;}
  .account-details div:last-child{border-bottom:none;}
  .account-details span{
    display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
    color:rgba(239,233,216,.5);margin-bottom:2px;
  }

  button, [role="button"]{-webkit-user-select:none;user-select:none;}
  input, select, textarea{font-size:16px;}


  /* Header */
  header.top{
    background:var(--navy);
    color:#EFE9D8;
    padding:calc(18px + env(safe-area-inset-top)) 16px 14px;
    position:sticky;
    top:0;
    z-index:30;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .top-title-wrap{display:flex;align-items:baseline;gap:8px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
  }
  #saveIndicator{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(239,233,216,0.5);
    opacity:0;transition:opacity .25s;
  }
  #saveIndicator.show{opacity:1;}
  .top-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    background:transparent;
    border:1px solid rgba(239,233,216,0.35);
    color:#EFE9D8;
    width:38px;height:38px;
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  .icon-btn:active{background:rgba(239,233,216,0.15);}

  .search-wrap{margin-top:12px;position:relative;}
  #searchInput{
    width:100%;
    background:rgba(239,233,216,0.1);
    border:1px solid rgba(239,233,216,0.3);
    color:#EFE9D8;
    padding:10px 12px 10px 32px;
    border-radius:var(--radius);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
  }
  #searchInput::placeholder{color:rgba(239,233,216,0.55);}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.6;font-size:13px;}

  /* Part tabs */
  .tabs-wrap{
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:110px;
    z-index:25;
    overflow-x:auto;
    white-space:nowrap;
    padding:0 8px;
    scrollbar-width:none;
    display:flex;
    align-items:center;
  }
  .tabs-wrap::-webkit-scrollbar{display:none;}
  .tab{
    display:inline-block;
    padding:13px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--rust);font-weight:600;}
  .tab-add{
    flex:0 0 auto;color:var(--rust);font-weight:700;font-size:16px;padding:13px 12px;cursor:pointer;
  }

  /* Summary */
  .summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:14px 16px 4px;
  }
  .stamp{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 10px;
  }
  .stamp .label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);}
  .stamp .amt{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin-top:3px;}
  .stamp.total .amt{color:var(--ink);}
  .stamp.paid{background:var(--green-bg);border-color:#cfdccb;}
  .stamp.paid .amt{color:var(--green);}
  .stamp.pending{background:var(--rust-bg);border-color:#e6c9be;}
  .stamp.pending .amt{color:var(--rust);}
  .subline{font-size:10px;color:var(--ink-soft);margin-top:1px;}

  .part-meta{
    padding:2px 16px 10px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .part-meta .title-edit{cursor:text;border-bottom:1px dashed transparent;}
  .part-meta .title-edit:active,.part-meta .title-edit.editing{border-bottom-color:var(--ink-soft);}
  .part-meta .del-link{cursor:pointer;color:var(--rust);flex:0 0 auto;}

  /* Rows */
  .list{padding:0 12px;}
  .row-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:8px;
    padding:10px 12px;
    position:relative;
    border-left:3px solid transparent;
  }
  .row-card.overdue{border-left-color:var(--rust);}
  .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .row-no{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    background:var(--line-soft);
    border-radius:2px;
    padding:1px 5px;
    margin-right:6px;
  }
  .row-name{
    font-family:'Fraunces',serif;
    font-size:15.5px;
    font-weight:600;
    outline:none;
    border-bottom:1px dashed transparent;
    cursor:text;
    display:inline;
  }
  .row-name:focus{border-bottom-color:var(--gold);background:var(--gold-bg);}
  .row-del{
    background:none;border:none;color:var(--ink-soft);
    font-size:17px;cursor:pointer;padding:4px 6px;line-height:1;
  }
  .row-del:active{color:var(--rust);}

  .row-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px 10px;
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .field{display:flex;flex-direction:column;gap:2px;}
  .field .k{font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-family:'Inter',sans-serif;}
  .field .v{outline:none;border-bottom:1px dashed transparent;cursor:text;padding:3px 0;min-height:18px;}
  .field .v:focus{border-bottom-color:var(--gold);background:var(--gold-bg);}
  .field select.cycle-sel{
    font-family:'IBM Plex Mono',monospace;font-size:13px;background:transparent;border:none;border-bottom:1px dashed var(--line);padding:3px 0;color:var(--ink);
  }

  .row-partial{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .row-partial .v{outline:none;border-bottom:1px dashed var(--line);cursor:text;padding:1px 2px;min-width:14px;display:inline-block;}
  .row-partial .v:focus{border-bottom-color:var(--gold);background:var(--gold-bg);}

  .row-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px;}
  .fee-tag{font-family:'IBM Plex Mono',monospace;font-size:13px;display:flex;align-items:center;gap:4px;}
  .fee-tag .cur{color:var(--ink-soft);}
  .fee-tag .v{font-weight:600;min-width:20px;outline:none;border-bottom:1px dashed transparent;}
  .fee-tag .v:focus{border-bottom-color:var(--gold);background:var(--gold-bg);}

  .status-chip{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    border:1px solid transparent;
    display:flex;align-items:center;gap:5px;
  }
  .status-chip.paid{background:var(--green-bg);color:var(--green);border-color:#cfdccb;}
  .status-chip.pending{background:var(--rust-bg);color:var(--rust);border-color:#e6c9be;}
  .status-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .crdate-line{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:6px;}
  .overdue-flag{font-size:10px;font-weight:700;color:var(--rust);margin-left:6px;text-transform:uppercase;letter-spacing:.04em;}

  /* Compact table view */
  .list.compact .row-card{padding:0;border:none;background:none;margin:0;}
  .compact-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.compact-table{width:100%;min-width:560px;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table.compact-table th{
    background:var(--line-soft);color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:7px 6px;font-weight:600;
  }
  table.compact-table td{padding:8px 6px;border-top:1px solid var(--line-soft);vertical-align:middle;}
  table.compact-table tr.overdue-row{background:var(--rust-bg);}
  table.compact-table td.name-cell{font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;outline:none;}
  table.compact-table td[contenteditable]:focus{background:var(--gold-bg);outline:none;}
  .mini-chip{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:10px;cursor:pointer;white-space:nowrap;}
  .mini-chip.paid{background:var(--green-bg);color:var(--green);}
  .mini-chip.pending{background:var(--rust-bg);color:var(--rust);}
  .mini-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:4px;}

  .empty-state{
    text-align:center;padding:48px 20px;color:var(--ink-soft);
  }
  .empty-state .big{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);margin-bottom:4px;}

  /* FAB */
  /* Anchored to the real screen edge (not the shell) so touch coordinates
     always match the visible button — the calc() below just nudges it in
     from the true edge enough to line up under the centered card once the
     shell is narrower than the viewport (wide/desktop-mode screens). */
  .fab{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom));right:calc(18px + max(0px, (100vw - 480px)/2));
    width:54px;height:54px;
    border-radius:50%;
    background:var(--rust);
    color:#fff;
    border:none;
    font-size:26px;
    box-shadow:0 4px 14px rgba(166,64,44,0.4);
    cursor:pointer;
    z-index:40;
    display:flex;align-items:center;justify-content:center;
    line-height:0;
  }
  .fab-menu{
    position:fixed;
    bottom:calc(80px + env(safe-area-inset-bottom));right:calc(18px + max(0px, (100vw - 480px)/2));
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 6px 20px rgba(0,0,0,0.15);
    z-index:41;
    overflow:hidden;
    min-width:200px;
    display:none;
  }
  .fab-menu.open{display:block;}
  .fab-menu button{
    display:block;width:100%;text-align:left;
    background:none;border:none;padding:13px 14px;
    font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
    cursor:pointer;border-bottom:1px solid var(--line-soft);
  }
  .fab-menu button:last-child{border-bottom:none;}
  .fab-menu button:active{background:var(--line-soft);}

  /* Options menu */
  .opt-menu{
    position:fixed;top:calc(60px + env(safe-area-inset-top));right:calc(12px + max(0px, (100vw - 480px)/2));
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 6px 20px rgba(0,0,0,0.18);
    z-index:41;min-width:230px;overflow:hidden;
    display:none;
    max-height:70vh;overflow-y:auto;
  }
  .opt-menu.open{display:block;}
  .opt-menu .section-label{padding:9px 14px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .opt-menu .item{padding:12px 14px;font-size:13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--line-soft);gap:10px;}
  .opt-menu .item:last-child{border-bottom:none;}
  .opt-menu .item:active{background:var(--line-soft);}
  .opt-menu .item.danger{color:var(--rust);}
  .opt-menu select.inline-sel{font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line);border-radius:2px;background:var(--paper);padding:3px 5px;}
  .currency-current{font-family:'IBM Plex Mono',monospace;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .currency-modal{padding-bottom:calc(18px + env(safe-area-inset-bottom));}
  .currency-modal input[type="search"]{margin-bottom:10px;}
  .currency-list{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
  .currency-option{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--ink);text-align:left;font-family:'Inter',sans-serif;cursor:pointer;}
  .currency-option:last-child{border-bottom:none;}
  .currency-option:active{background:var(--line-soft);}
  .currency-option .currency-name{font-size:13px;}
  .currency-option .currency-code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;}

  .switch{width:36px;height:20px;background:var(--line);border-radius:20px;position:relative;transition:background .15s;flex:0 0 auto;}
  .switch.on{background:var(--green);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .15s;}
  .switch.on::after{left:18px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(35,58,54,0.45);
    z-index:50;display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper-raised);
    width:100%;max-width:480px;
    border-radius:14px 14px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;
  }
  .modal h2{font-family:'Fraunces',serif;font-size:18px;margin:0 0 14px;}
  .modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:12px 0 4px;}
  .modal input,.modal select{
    width:100%;padding:10px 10px;border:1px solid var(--line);border-radius:var(--radius);
    font-family:'Inter',sans-serif;font-size:15px;background:var(--paper);color:var(--ink);
  }
  .modal .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn{
    flex:1;padding:12px;border-radius:var(--radius);border:1px solid var(--line);
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--paper);color:var(--ink);
  }
  .btn.primary{background:var(--navy);color:#EFE9D8;border-color:var(--navy);}
  .btn:active{opacity:0.85;}

  .totals-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .totals-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:6px 4px;border-bottom:1px solid var(--line);}
  .totals-table td{padding:7px 4px;border-bottom:1px solid var(--line-soft);font-family:'IBM Plex Mono',monospace;}
  .totals-table td.tn{font-family:'Fraunces',serif;font-weight:600;font-size:13px;}

  .toast{
    position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--navy);color:#EFE9D8;padding:9px 16px;border-radius:20px;
    font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;}

  .account-details{margin:18px 0 4px;border:1px solid rgba(239,233,216,0.22);border-radius:var(--radius);overflow:hidden;text-align:left;}
  .account-details div{padding:10px 12px;border-bottom:1px solid rgba(239,233,216,0.12);font-size:13px;}
  .account-details div:last-child{border-bottom:none;}
  .account-details span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:rgba(239,233,216,0.5);margin-bottom:2px;}
  @media(max-width:520px){#authScreen{padding:16px 14px;} .auth-card{max-width:380px;} .auth-card input{min-height:44px;font-size:16px;} .auth-btn,.auth-secondary,.social-btn{min-height:44px;}}


  /* Samsung A56 / Chrome Desktop-site protection */
  html{width:100%;min-width:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{width:100%;min-width:0;overflow-x:hidden;}
  #shell{width:100%;max-width:none;margin:0;min-height:100dvh;}
  #authScreen{position:absolute;inset:0;width:100%;min-height:100dvh;padding:20px 16px;overflow-y:auto;}
  .auth-card{width:100%;max-width:360px;margin:auto;}
  .auth-mark{font-size:26px !important;line-height:1.15 !important;}
  .auth-welcome{font-size:19px !important;line-height:1.2 !important;}

/* ---------------- Date helpers ---------------- */
function dmyToIso(dmy){
  if(!dmy) return "";
  const p = dmy.split("/");
  if(p.length!==3) return "";
  const [d,m,y] = p;
  return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
}
function isoToDmy(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  if(!y) return "";
  return `${d}/${m}/${y}`;
}
function addToDate(dmy, cycle){
  const iso = dmyToIso(dmy);
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  if(cycle==="1 month"){
    d.setMonth(d.getMonth()+1);
  } else {
    d.setDate(d.getDate()+30);
  }
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${day}/${m}/${y}`;
}
function isPastDmy(dmy){
  const iso = dmyToIso(dmy);
  if(!iso) return false;
  const d = new Date(iso+"T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  return d.getTime() < today.getTime();
}
// Dates are always displayed and stored as DD/MM/YYYY
function toDisplayDate(dmy){ return dmy || ""; }
function fromDisplayDate(str){ return str || ""; }
function uid(){ return 'r'+Math.random().toString(36).slice(2,10); }
function todayDmy(){
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

const memoryBackingStore = {};
const memoryStore = {
  async get(key){
    if(!(key in memoryBackingStore)) throw new Error('not found');
    return {key, value:memoryBackingStore[key], shared:false};
  },
  async set(key, value){
    memoryBackingStore[key] = value;
    return {key, value, shared:false};

    return {key, value:raw, shared:false};

  async set(key, value){

async function loadState(){
  let localState = null;
  try{
    const res = await storageAPI.get(STORE_KEY, false);

  if(localState){
    if(!localState.settings) localState.settings = {currency:'INR', dateFormat:'DMY'};

  }

  if(firebaseUser){

      const ref = firebaseDb.collection('users').doc(firebaseUser.uid).collection('app').doc('main');
      const snap = await ref.get();
      if(snap.exists && snap.data() && snap.data().state){

        await ref.set({state, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      }

}

  try{
    if(firebaseUser){
      const ref = firebaseDb.collection('users').doc(firebaseUser.uid).collection('app').doc('main');
      await ref.set({state, updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    await storageAPI.set(STORE_KEY, JSON.stringify(state), false);
    flashSaved();
  }catch(e){
    console.error("save failed", e);
    showToast(firebaseUser ? "Couldn't save to cloud — check your connection" : "Couldn't save — check your connection");
  }
}
function debounce(fn, ms){
  let t;
  return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); };
}
const saveSoon = debounce(saveState, 500);
function flashSaved(){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  el.textContent = 'saved ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 1600);
}

async function getProfile(){

    try{
      const snap = await firebaseDb.collection('users').doc(firebaseUser.uid).get();
      if(snap.exists) return snap.data();
    }catch(e){ console.error('Profile cloud load failed',e); }

  try{

  }catch(e){ return null; }
}
async function setProfile(p){

    await firebaseDb.collection('users').doc(firebaseUser.uid).set(
      {...p,uid:firebaseUser.uid,email:firebaseUser.email||p.email},
      {merge:true}
    );
  }
  await storageAPI.set(PROFILE_KEY,JSON.stringify(p),false);
}

// Firebase Authentication handles the real Google sign-in.
// Use popup flow here because some mobile browsers can partition/clear
// sessionStorage during a redirect to Firebase's auth handler.
let googleLoginBusy = false;

async function startGoogleLogin(){
  if(googleLoginBusy) return;
  googleLoginBusy = true;
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const remember = localStorage.getItem('tuitionRememberMe') !== 'false';
    await firebaseAuth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    await firebaseAuth.signInWithPopup(provider);
  }catch(e){
    console.error('Firebase Google sign-in error:', e);
    let message = 'Could not sign in with Google. Please try again.';
    if(e && e.code === 'auth/unauthorized-domain'){
      message = 'This website is not authorized in Firebase yet. Please add vik970000.github.io in Firebase Authentication → Settings → Authorized domains.';
    }else if(e && e.code === 'auth/operation-not-allowed'){
      message = 'Google sign-in is not enabled in Firebase Authentication.';
    }else if(e && e.code === 'auth/popup-blocked'){
      message = 'Google sign-in was blocked by the browser. Please allow pop-ups and try again.';
    }else if(e && e.code === 'auth/popup-closed-by-user'){
      message = 'Google sign-in was closed. Please try again.';
    }else if(e && e.code === 'auth/network-request-failed'){
      message = 'Internet connection problem. Please check your connection and try again.';
    }
    alert(message);
  }finally{
    googleLoginBusy = false;
  }
}

  if(kind==='google') url += (url.includes('?')?'&':'?')+'provider=google';

}

  document.getElementById('googleBtn').onclick=startGoogleLogin;
  document.getElementById('toggleAcctPassword').onclick=()=>{
    const input=document.getElementById('acctPassword');
    const btn=document.getElementById('toggleAcctPassword');
    const icon=document.getElementById('passwordEyeIcon');
    const showing=input.type==='password';
    input.type=showing?'text':'password';
    btn.setAttribute('aria-label',showing?'Hide password':'Show password');
    btn.title=showing?'Hide password':'Show password';
    icon.innerHTML=showing
      ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a18.2 18.2 0 0 1-3.2 3.9"/><path d="M6.1 6.1C3.5 7.8 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"/>'
      : '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>';
  };
  const rememberInput=document.getElementById('rememberMe');
  rememberInput.checked = localStorage.getItem('tuitionRememberMe') !== 'false';
  rememberInput.addEventListener('change',()=>{
    localStorage.setItem('tuitionRememberMe', String(rememberInput.checked));
  });
  document.getElementById('signinLink').onclick=()=>renderEmailSignIn();
  document.getElementById('saveAccountBtn').onclick=async()=>{
    const name=document.getElementById('acctName').value.trim(),email=document.getElementById('acctEmail').value.trim(),password=document.getElementById('acctPassword').value;
    const rememberMe=document.getElementById('rememberMe').checked;
    const err=document.getElementById('authErr'); err.textContent='';
    if(!name){err.textContent='Enter your name.';return;}
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Enter a valid email.';return;}
    if(!password){err.textContent='Enter a password.';return;}
    try{
      await firebaseAuth.setPersistence(rememberMe ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      const cred=await firebaseAuth.createUserWithEmailAndPassword(email,password);
      await cred.user.updateProfile({displayName:name});
      await setProfile({name,email,createdAt:new Date().toISOString(),rememberMe});
      showToast('Account created successfully.');
    }catch(e){
      console.error(e);
      if(e && e.code==='auth/email-already-in-use') err.textContent='This email already has an account. Please sign in.';
      else if(e && e.code==='auth/weak-password') err.textContent='Password must be at least 6 characters.';
      else if(e && e.code==='auth/invalid-email') err.textContent='Enter a valid email.';
      else err.textContent='Could not create account. Please try again.';
    }
  };
}

    try{
      await firebaseAuth.sendPasswordResetEmail(email);
      err.textContent='Password reset email sent. Check your email inbox.';
    }catch(e){
      console.error(e);
      if(e && e.code==='auth/invalid-email') err.textContent='Enter a valid email address.';
      else if(e && e.code==='auth/user-not-found') err.textContent='No account found with this email.';
      else err.textContent='Could not send the reset email. Please try again.';
    }
  };
  document.getElementById('emailSignInBtn').onclick=async()=>{
    const email=document.getElementById('signinEmail').value.trim(),password=document.getElementById('signinPassword').value;
    const remember=document.getElementById('signinRemember').checked,err=document.getElementById('signinErr'); err.textContent='';
    if(!email){err.textContent='Enter your email.';return;}
    if(!password){err.textContent='Enter your password.';return;}
    try{
      await firebaseAuth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      await firebaseAuth.signInWithEmailAndPassword(email,password);
    }catch(e){
      console.error(e);
      if(e && (e.code==='auth/invalid-login-credentials'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found')) err.textContent='Email or password is incorrect.';
      else if(e && e.code==='auth/too-many-requests') err.textContent='Too many attempts. Please try again later.';
      else err.textContent='Could not sign in. Please try again.';
    }
  };
}

async function unlockApp(){
  if(!firebaseUser){
    showToast('Please use Continue with Google first');
    return;
  }
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appRoot').style.display='';
  if(!state) await loadState();
  compact = !!state.compact;
  document.getElementById('compactSwitch').classList.toggle('on', compact);
  normalizeCurrencySetting();
  state.settings.dateFormat = 'DMY';
  updateCurrencyCurrent();
  currentPartIdx = state.parts.length - 1;
  for(let i=state.parts.length-1;i>=0;i--){ if(state.parts[i].entries.length>0){ currentPartIdx=i; break; } }
  renderAll();
}
async function startAuthFlow(){
  if(persistenceWarningNeeded)showToast('Your browser may not save data after you close this file');
  try{await storageAPI.delete(OLD_PROFILE_KEY,false);}catch(e){}
  firebaseAuth.onAuthStateChanged(async(user)=>{
    firebaseUser=user||null;
    if(firebaseUser){
      try{
        const googleProfile={
          name:firebaseUser.displayName || (firebaseUser.email||'').split('@')[0],
          email:firebaseUser.email || '',
          age:'', country:'',
          googleSub:firebaseUser.uid,
          createdAt:new Date().toISOString()
        };
        let profile=await getProfile();
        if(!profile){ profile=googleProfile; }
        else { profile={...googleProfile,...profile,email:firebaseUser.email||profile.email}; }
        await setProfile(profile);
        await loadState();
        renderLoginScreen(profile);
      }catch(e){
        console.error(e);
        alert('Signed in, but your cloud data could not be loaded yet.');
        renderCreateAccount();
      }
    }else{
      state=null;
      document.getElementById('appRoot').style.display='none';
      document.getElementById('authScreen').classList.remove('hidden');
      renderCreateAccount();
    }
  });
}


/* ---------------- Rendering ---------------- */
const tabsWrap = document.getElementById('tabsWrap');
const summaryEl = document.getElementById('summary');
const partMetaEl = document.getElementById('partMeta');
const listEl = document.getElementById('list');

function cur(){ const c=currencyInfo(state.settings.currency); return c.symbol; }
function fmtFee(fee){
  return fee===null || fee===undefined ? "—" : fee;
}
function moneyLine(entry){
  const fee = entry.fee || 0;
  if(entry.paid) return { collected: fee, outstanding: 0 };
  const pa = entry.paidAmount || 0;
  return { collected: pa, outstanding: Math.max(0, fee - pa) };
}

function renderTabs(){
  tabsWrap.innerHTML = "";
  state.parts.forEach((p,idx)=>{
    const t = document.createElement('span');
    t.className = 'tab' + (idx===currentPartIdx ? ' active' : '');
    t.textContent = p.label;
    t.onclick = ()=>{ currentPartIdx = idx; searchTerm=''; document.getElementById('searchInput').value=''; renderAll(); };
    tabsWrap.appendChild(t);
  });
  const addTab = document.createElement('span');
  addTab.className = 'tab-add';
  addTab.textContent = '+';
  addTab.title = 'Start a new part';
  addTab.onclick = openPartModal;
  tabsWrap.appendChild(addTab);
}

function renderSummary(){
  const part = state.parts[currentPartIdx];
  let total=0, paid=0, pending=0, paidCount=0, pendingCount=0, partialCount=0;
  part.entries.forEach(e=>{
    const f = e.fee || 0;
    const {collected, outstanding} = moneyLine(e);
    total += f;
    paid += collected;
    pending += outstanding;
    if(e.paid) paidCount++; else {
      pendingCount++;
      if((e.paidAmount||0) > 0) partialCount++;
    }
  });
  summaryEl.innerHTML = `
    <div class="stamp total"><div class="label">Total</div><div class="amt">${cur()}${total}</div><div class="subline">${part.entries.length} people</div></div>
    <div class="stamp paid"><div class="label">Collected</div><div class="amt">${cur()}${paid}</div><div class="subline">${paidCount} fully paid</div></div>
    <div class="stamp pending"><div class="label">Outstanding</div><div class="amt">${cur()}${pending}</div><div class="subline">${pendingCount} pending${partialCount?` (${partialCount} partial)`:''}</div></div>
  `;
}

function renderPartMeta(){
  const part = state.parts[currentPartIdx];
  partMetaEl.innerHTML = `
    <span>Cycle starts <span class="title-edit" contenteditable="true" id="partDateEdit">${part.date || 'set a date'}</span></span>
    <span class="del-link" id="deletePartBtn">Delete part</span>
  `;
  const dEl = document.getElementById('partDateEdit');
  dEl.addEventListener('blur', ()=>{
    part.date = dEl.textContent.trim();
    saveSoon();
  });
  document.getElementById('deletePartBtn').onclick = ()=>{
    if(state.parts.length<=1) return showToast("Can't delete the only part");
    if(confirm(`Delete ${part.label}? This can't be undone.`)){
      state.parts.splice(currentPartIdx,1);
      currentPartIdx = Math.max(0,currentPartIdx-1);
      saveSoon();
      renderAll();
    }
  };
}

function matchesSearch(entry){
  if(!searchTerm) return true;
  return entry.name.toLowerCase().includes(searchTerm.toLowerCase());
}

function renderList(){
  const part = state.parts[currentPartIdx];
  listEl.className = 'list' + (compact ? ' compact' : '');
  listEl.innerHTML = '';

  const visible = part.entries
    .map((e,i)=>({e,i}))
    .filter(x=>matchesSearch(x.e));

  if(visible.length===0){
    listEl.innerHTML = `<div class="empty-state"><div class="big">No one here yet</div>${searchTerm? 'No names match your search in this part.' : 'Tap the + button to add the first person.'}</div>`;
    return;
  }

  if(compact){
    const scroller = document.createElement('div');
    scroller.className = 'compact-scroll';
    const tbl = document.createElement('table');
    tbl.className = 'compact-table';
    tbl.innerHTML = `<thead><tr>
      <th>No</th><th>Name</th><th>Start</th><th>End</th><th>Fee</th><th>Status</th><th></th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    visible.forEach(({e,i})=>{
      const tr = document.createElement('tr');
      if(!e.paid && e.end && isPastDmy(e.end)) tr.classList.add('overdue-row');
      tr.innerHTML = `
        <td>${i+1}</td>
        <td class="name-cell" contenteditable="true" data-field="name">${e.name}</td>
        <td contenteditable="true" data-field="start">${toDisplayDate(e.start)}</td>
        <td contenteditable="true" data-field="end">${toDisplayDate(e.end)}</td>
        <td contenteditable="true" data-field="fee">${fmtFee(e.fee)}</td>
        <td><span class="mini-chip ${e.paid?'paid':'pending'}" data-action="toggle">${e.paid?'Paid':'Pending'}</span></td>
        <td><button class="mini-del" data-action="del">✕</button></td>
      `;
      wireRow(tr, e, part);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    scroller.appendChild(tbl);
    listEl.appendChild(scroller);
    return;
  }

  visible.forEach(({e,i})=>{
    const overdue = !e.paid && e.end && isPastDmy(e.end);
    const card = document.createElement('div');
    card.className = 'row-card' + (overdue ? ' overdue' : '');
    const {outstanding} = moneyLine(e);
    card.innerHTML = `
      <div class="row-top">
        <div><span class="row-no">${i+1}</span><span class="row-name" contenteditable="true" data-field="name">${e.name}</span>${overdue?'<span class="overdue-flag">Overdue</span>':''}</div>
        <button class="row-del" data-action="del">✕</button>
      </div>
      <div class="row-grid">
        <div class="field"><span class="k">Start date</span><span class="v" contenteditable="true" data-field="start">${toDisplayDate(e.start)}</span></div>
        <div class="field"><span class="k">Cycle</span>
          <select class="cycle-sel" data-field="cycle">
            <option value="30 days" ${e.cycle==='30 days'?'selected':''}>30 days</option>
            <option value="1 month" ${e.cycle==='1 month'?'selected':''}>1 month</option>
          </select>
        </div>
        <div class="field"><span class="k">End date</span><span class="v" contenteditable="true" data-field="end">${toDisplayDate(e.end)}</span></div>
        <div class="field"><span class="k">Cr. date</span><span class="v" contenteditable="true" data-field="crDate">${toDisplayDate(e.crDate)||'—'}</span></div>
      </div>
      ${!e.paid ? `<div class="row-partial">Paid so far: ${cur()}<span class="v" contenteditable="true" data-field="paidAmount">${e.paidAmount!==null && e.paidAmount!==undefined ? e.paidAmount : 0}</span>${outstanding>0?` · ${cur()}${outstanding} left`:''}</div>` : ''}
      <div class="row-bottom">
        <div class="fee-tag"><span class="cur">${cur()}</span><span class="v" contenteditable="true" data-field="fee">${fmtFee(e.fee)}</span></div>
        <div class="status-chip ${e.paid?'paid':'pending'}" data-action="toggle"><span class="dot"></span>${e.paid?'Paid':'Pending'}</div>
      </div>
    `;
    wireRow(card, e, part);
    listEl.appendChild(card);
  });
}

function wireRow(el, entry, part){
  el.querySelectorAll('[data-field]').forEach(fieldEl=>{
    const field = fieldEl.dataset.field;
    if(fieldEl.tagName === 'SELECT'){
      fieldEl.addEventListener('change', ()=>{
        entry.cycle = fieldEl.value;
        entry.end = addToDate(entry.start, entry.cycle);
        saveSoon();
        renderAll();
      });
      return;
    }
    fieldEl.addEventListener('blur', ()=>{
      let val = fieldEl.textContent.trim();
      if(field==='fee'){
        const n = parseFloat(val.replace(/[^\d.]/g,''));
        entry.fee = isNaN(n) ? null : n;
        fieldEl.textContent = fmtFee(entry.fee);
      } else if(field==='paidAmount'){
        const n = parseFloat(val.replace(/[^\d.]/g,''));
        entry.paidAmount = isNaN(n) ? 0 : n;
        renderAll();
        saveSoon();
        return;
      } else if(field==='crDate'){
        entry.crDate = (val==='—') ? '' : fromDisplayDate(val);
      } else if(field==='name'){
        entry.name = val || 'Unnamed';
      } else if(field==='start' || field==='end'){
        entry[field] = fromDisplayDate(val);
      } else {
        entry[field] = val;
      }
      saveSoon();
      renderSummary();
    });
    fieldEl.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){ ev.preventDefault(); fieldEl.blur(); }
    });
  });
  const toggle = el.querySelector('[data-action="toggle"]');
  if(toggle){
    toggle.addEventListener('click', ()=>{
      entry.paid = !entry.paid;
      if(entry.paid){
        entry.paidAmount = null;
        if(!entry.crDate) entry.crDate = todayDmy();
      }
      saveSoon();
      renderAll();
    });
  }
  const del = el.querySelector('[data-action="del"]');
  if(del){
    del.addEventListener('click', ()=>{
      if(confirm(`Remove ${entry.name} from ${part.label}?`)){
        part.entries = part.entries.filter(x=>x.id!==entry.id);
        saveSoon();
        renderAll();
      }
    });
  }
}

  renderSummary();
  renderPartMeta();
  renderList();
}

function currencyInfo(value){
  if(!value) return CURRENCIES.find(c=>c.code==='INR') || CURRENCIES[0];
  return CURRENCIES.find(c=>c.code===value) || CURRENCIES.find(c=>c.symbol===value) || CURRENCIES.find(c=>c.code==='INR') || CURRENCIES[0];
}
function normalizeCurrencySetting(){
  const info = currencyInfo(state.settings.currency);
  state.settings.currency = info.code;
}

    !q || c.code.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q)
  );
  list.innerHTML = '';
  matches.forEach(c=>{

    b.className='currency-option';
    b.innerHTML = `<span class="currency-name">${c.name}</span><span class="currency-code">${c.code} · ${c.symbol}</span>`;

      document.getElementById('currencyOverlay').classList.remove('open');
      renderAll();

}

/* ---------------- Totals view ---------------- */
function openTotals(){
  const perPerson = {};
  let grandTotal=0, grandPaid=0, grandPending=0;
  state.parts.forEach(part=>{
    part.entries.forEach(e=>{
      const fee = e.fee||0;
      const {collected, outstanding} = moneyLine(e);
      grandTotal += fee; grandPaid += collected; grandPending += outstanding;
      if(!perPerson[e.name]) perPerson[e.name] = {parts:0, fee:0, paid:0, pending:0};
      perPerson[e.name].parts++;
      perPerson[e.name].fee += fee;
      perPerson[e.name].paid += collected;
      perPerson[e.name].pending += outstanding;
    });
  });
  const rows = Object.entries(perPerson).sort((a,b)=> b[1].fee - a[1].fee);
  let html = `
    <div class="summary" style="padding:0;margin-bottom:6px;">
      <div class="stamp total"><div class="label">Total billed</div><div class="amt">${cur()}${grandTotal}</div><div class="subline">${state.parts.length} parts</div></div>
      <div class="stamp paid"><div class="label">Collected</div><div class="amt">${cur()}${grandPaid}</div></div>
      <div class="stamp pending"><div class="label">Outstanding</div><div class="amt">${cur()}${grandPending}</div></div>
    </div>
    <table class="totals-table"><thead><tr><th>Name</th><th>Parts</th><th>Billed</th><th>Paid</th><th>Owed</th></tr></thead><tbody>
  `;
  if(rows.length===0){
    html += `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:16px 0;">No records yet</td></tr>`;
  }
  rows.forEach(([name, r])=>{
    html += `<tr><td class="tn">${name}</td><td>${r.parts}</td><td>${cur()}${r.fee}</td><td>${cur()}${r.paid}</td><td>${cur()}${r.pending}</td></tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('totalsBody').innerHTML = html;
  document.getElementById('totalsOverlay').classList.add('open');
}

/* ---------------- CSV export ---------------- */
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function exportCsv(all){
  const header = all
    ? ["Part","No","Name","Start Date","Cycle","End Date","Fee","Status","Paid So Far","Cr. Date"]
    : ["No","Name","Start Date","Cycle","End Date","Fee","Status","Paid So Far","Cr. Date"];
  const rows = [header];
  const parts = all ? state.parts : [state.parts[currentPartIdx]];
  parts.forEach(part=>{
    part.entries.forEach((e,i)=>{
      const row = [i+1, e.name, e.start, e.cycle, e.end, e.fee===null?'':e.fee, e.paid?'Paid':'Pending', e.paid ? '' : (e.paidAmount||0), e.crDate];
      if(all) row.unshift(part.label);
      rows.push(row);
    });
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = all ? 'tuition_fee_all_parts.csv' : `${state.parts[currentPartIdx].label.replace(/\s+/g,'_')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(all ? "Exported all parts" : `Exported ${state.parts[currentPartIdx].label}`);
}
function downloadBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tuition_fee_backup_${todayDmy().replace(/\//g,'-')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Backup downloaded");
}

/* ---------------- PDF export ---------------- */
function pdfMoney(amount){
  const c = currencyInfo(state.settings.currency);
  const n = Number(amount || 0);
  const formatted = n.toLocaleString(undefined,{maximumFractionDigits:2});
  return `${c.symbol} ${formatted}`;
}

function pdfGeneratedStamp(){
  const d = new Date();
  const date = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  return `${date} ${time}`;
}

function pdfDate(value){
  if(!value) return '—';
  // Keep the app's stored DD/MM/YYYY display exactly when already formatted.
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(String(value))) return String(value);
  const d = new Date(value);
  if(!Number.isNaN(d.getTime())){
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  return String(value);
}

function pdfDrawWaveFooter(doc){
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();

  // White/cream page with a clean curved green + gold footer.
  doc.setFillColor(34,78,68);
  doc.triangle(0,H-33,0,H,W*0.47,H-12,'F');
  doc.triangle(W,H-33,W,H,W*0.48,H-12,'F');
  doc.rect(0,H-12,W,12,'F');

  doc.setDrawColor(190,150,65);
  doc.setLineWidth(3.0);
  const pts=[];
  for(let x=0;x<=W;x+=3){
    const t=x/W;
    const y=H-28 + 13*Math.sin((t*1.05)*Math.PI*2 + 0.2);
    pts.push([x,y]);
  }
  for(let i=1;i<pts.length;i++) doc.line(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);
  doc.setLineWidth(0.2);
}

function pdfDrawTable(doc,part,y){
  const W = doc.internal.pageSize.getWidth();
  const left = 9;
  const tableW = W-18;
  const cols = [
    {h:'No.',w:11,align:'center'},
    {h:'Name',w:27,align:'left'},
    {h:'Start',w:25,align:'center'},
    {h:'Cycle',w:21,align:'center'},
    {h:'End',w:25,align:'center'},
    {h:'Fee',w:20,align:'right'},
    {h:'Status',w:22,align:'center'},
    {h:'Paid',w:20,align:'right'},
    {h:'Cr. Date',w:15,align:'center'}
  ];
  const scale = tableW/cols.reduce((s,c)=>s+c.w,0);
  cols.forEach(c=>c.w*=scale);

  const headerH=13, rowH=12;
  let x=left;

  doc.setFillColor(20,91,72);
  doc.roundedRect(left,y,tableW,headerH,2,2,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.3);
  doc.setTextColor(255,255,255);
  cols.forEach(c=>{
    const tx=c.align==='center'?x+c.w/2:c.align==='right'?x+c.w-2:x+2;
    doc.text(c.h,tx,y+8.5,{align:c.align});
    x+=c.w;
  });

  let cy=y+headerH;
  const rows=part.entries||[];
  rows.forEach((e,i)=>{
    doc.setFillColor(i%2===0?253:248,i%2===0?251:246,i%2===0?244:235);
    doc.setDrawColor(214,208,191);
    doc.setLineWidth(0.25);
    doc.rect(left,cy,tableW,rowH,'FD');

    const isPaid=!!e.paid;
    const vals=[
      String(i+1),
      String(e.name||'').slice(0,20),
      pdfDate(e.start),
      String(e.cycle||''),
      pdfDate(e.end),
      e.fee==null?'—':pdfMoney(e.fee),
      isPaid?'Paid':'Pending',
      pdfMoney(isPaid?(e.fee||0):(e.paidAmount||0)),
      e.crDate?pdfDate(e.crDate):'—'
    ];

    x=left;
    cols.forEach((c,j)=>{
      const tx=c.align==='center'?x+c.w/2:c.align==='right'?x+c.w-2:x+2;
      if(j===1){
        doc.setFont('helvetica','bold');
        doc.setFontSize(8.5);
      }else{
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
      }

      if(j===6){
        const chipW=Math.min(c.w-3,20);
        const chipH=7;
        const chipX=x+(c.w-chipW)/2;
        const chipY=cy+2.5;
        if(isPaid){
          doc.setFillColor(217,235,220);
          doc.setTextColor(31,105,76);
        }else{
          doc.setFillColor(250,231,190);
          doc.setTextColor(148,92,20);
        }
        doc.roundedRect(chipX,chipY,chipW,chipH,3.5,3.5,'F');
        doc.setFont('helvetica','bold');
        doc.setFontSize(7.5);
        doc.text(vals[j],x+c.w/2,cy+7.4,{align:'center'});
      }else{
        doc.setTextColor(38,38,35);
        doc.text(vals[j],tx,cy+7.8,{align:c.align});
      }
      x+=c.w;
    });
    cy+=rowH;
  });

  return cy;
}

function pdfDrawSummary(doc,part,y){
  const W=doc.internal.pageSize.getWidth();
  const left=9, boxW=W-18, boxH=25;
  const entries=part.entries||[];
  const total=entries.reduce((s,e)=>s+Number(e.fee||0),0);
  const paid=entries.reduce((s,e)=>s+(e.paid?Number(e.fee||0):Number(e.paidAmount||0)),0);
  const due=Math.max(0,total-paid);

  doc.setFillColor(237,245,238);
  doc.setDrawColor(200,218,203);
  doc.roundedRect(left,y,boxW,boxH,3,3,'FD');

  const cards=[
    ['Total Students',String(entries.length),'normal','people'],
    ['Total Fee',pdfMoney(total),'normal','fee'],
    ['Total Paid',pdfMoney(paid),'paid','check'],
    ['Total Due',pdfMoney(due),'due','clock']
  ];
  const cw=boxW/4;

  cards.forEach((c,i)=>{
    const cx=left+i*cw+cw/2;
    if(i>0){
      doc.setDrawColor(210,220,211);
      doc.line(left+i*cw,y+5,left+i*cw,y+boxH-5);
    }

    // Small visual icon.
    const ix=cx-cw*0.27;
    const iy=y+12.5;
    doc.setLineWidth(1.3);
    if(c[3]==='check'){
      doc.setFillColor(39,111,84); doc.circle(ix,iy,5.5,'F');
      doc.setDrawColor(255,255,255); doc.setLineWidth(1.5);
      doc.line(ix-2.3,iy,ix-0.5,iy+2.1); doc.line(ix-0.5,iy+2.1,ix+3.2,iy-2.6);
    }else if(c[3]==='clock'){
      doc.setDrawColor(158,82,27); doc.setLineWidth(1.2); doc.circle(ix,iy,5.2,'S');
      doc.line(ix,iy,ix,iy-3); doc.line(ix,iy,ix+2.4,iy+1.7);
    }else if(c[3]==='fee'){
      doc.setFillColor(48,105,83); doc.roundedRect(ix-4.5,iy-4,9,8,1.2,1.2,'F');
      doc.setFillColor(237,245,238); doc.circle(ix,iy-1.2,1.3,'F');

      doc.ellipse(ix,iy+3.2,5.8,2.5,'F');

    doc.text(c[1],cx+5,y+18.5,{align:'center'});

  return y+boxH;

function exportPdf(all){
  if(!window.jspdf || !window.jspdf.jsPDF){
    showToast("PDF export is unavailable right now");
    return;
  }

  const {jsPDF}=window.jspdf;
  const parts=all ? state.parts : [state.parts[currentPartIdx]];
  if(!parts.length) return;

  const generated=pdfGeneratedStamp();
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  let pageNo=0;

  parts.forEach(part=>{
    const rows=part.entries||[];
    const firstPageRows=Math.max(1,Math.floor((235-73)/12));
    const laterPageRows=Math.max(1,Math.floor((265-20)/12));
    const chunks=[];

    if(!rows.length) chunks.push([]);
    else{
      chunks.push(rows.slice(0,firstPageRows));
      for(let i=firstPageRows;i<rows.length;i+=laterPageRows) chunks.push(rows.slice(i,i+laterPageRows));
    }

    chunks.forEach((chunk,chunkIndex)=>{
      if(pageNo>0) doc.addPage();
      pageNo++;

      const original=part.entries;
      part.entries=chunk;

      let y=pdfDrawHeader(doc,part,generated);
      if(chunkIndex>0){
        doc.setFont('helvetica','bold');
        doc.setFontSize(9);
        doc.setTextColor(75,70,60);
        doc.text(`${part.label||'Part'} — continued`,9,y-5);
      }

      y=pdfDrawTable(doc,part,y);
      if(chunkIndex===0){
        y+=9;
        y=pdfDrawSummary(doc,part,y);
        if(y<238) pdfDrawNotes(doc,y+10);
      }

      part.entries=original;
    });
  });

  const totalPages=doc.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    pdfDrawFooter(doc,i,totalPages);
  }

  const safeName=(all
    ? 'tuition_fee_all_parts'
    : (state.parts[currentPartIdx].label||'part').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'')
  ).toLowerCase();

  doc.save(`${safeName||'tuition_fee'}.pdf`);
  showToast(all ? 'PDF exported: all parts' : `PDF exported: ${state.parts[currentPartIdx].label}`);
}

/* ---------------- Init ---------------- */
async function init(){
  await loadState();
  compact = !!state.compact;
  document.getElementById('compactSwitch').classList.toggle('on', compact);
  normalizeCurrencySetting();
  state.settings.dateFormat = 'DMY';
  updateCurrencyCurrent();
  currentPartIdx = state.parts.length - 1;
  for(let i=state.parts.length-1;i>=0;i--){
    if(state.parts[i].entries.length>0){ currentPartIdx = i; break; }
  }
  renderAll();
}

startAuthFlow();
</script>
</body>
